name: Linux Build using GCC

on:
  push:
    branches:
      - velox-cudf
      - pull-request/[0-9]+

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  adapters:
    name: Linux release with adapters
    runs-on: linux-amd64-cpu16
    container: ghcr.io/facebookincubator/velox-dev:adapters
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: "${{ github.workspace }}/ccache"
      VELOX_DEPENDENCY_SOURCE: SYSTEM
      GTest_SOURCE: BUNDLED
      simdjson_SOURCE: BUNDLED
      xsimd_SOURCE: BUNDLED
      Arrow_SOURCE: BUNDLED
      Thrift_SOURCE: BUNDLED
      cudf_SOURCE: BUNDLED
      CUDA_VERSION: "12.9"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Fix git permissions
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}

      - name: Install Dependencies
        run: |
          if ! yum list installed cuda-nvcc-$(echo ${CUDA_VERSION} | tr '.' '-') 1>/dev/null || \
             ! yum list installed libnvjitlink-devel-$(echo ${CUDA_VERSION} | tr '.' '-') 1>/dev/null; then
            source scripts/setup-centos-adapters.sh
            install_cuda ${CUDA_VERSION}
          fi
          pip install cmake==3.30.4

      - uses: apache/infrastructure-actions/stash/restore@3354c1565d4b0e335b78a76aedd82153a9e144d4
        with:
          path: "${{ env.CCACHE_DIR }}"
          key: ccache-linux-adapters

      - name: Zero Ccache Statistics
        run: ccache -sz

      - name: Make Release Build
        env:
          MAKEFLAGS: TREAT_WARNINGS_AS_ERRORS=0 NUM_THREADS=16 MAX_HIGH_MEM_JOBS=4
          CUDA_ARCHITECTURES: 70
          CUDA_COMPILER: /usr/local/cuda-${CUDA_VERSION}/bin/nvcc
          CUDA_FLAGS: -ccbin /opt/rh/gcc-toolset-14/root/usr/bin
        run: |
          EXTRA_CMAKE_FLAGS=(
            "-DVELOX_ENABLE_BENCHMARKS=ON"
            "-DVELOX_ENABLE_ARROW=ON"
            "-DVELOX_ENABLE_PARQUET=ON"
            "-DVELOX_ENABLE_HDFS=ON"
            "-DVELOX_ENABLE_S3=ON"
            "-DVELOX_ENABLE_GCS=ON"
            "-DVELOX_ENABLE_ABFS=ON"
            "-DVELOX_ENABLE_REMOTE_FUNCTIONS=ON"
            "-DVELOX_ENABLE_GPU=ON"
            "-DVELOX_ENABLE_CUDF=ON"
            "-DVELOX_MONO_LIBRARY=ON"
          )
          source /opt/rh/gcc-toolset-14/enable
          CC=gcc CXX=g++ make release EXTRA_CMAKE_FLAGS="${EXTRA_CMAKE_FLAGS[*]}"

      - name: Ccache after
        run: ccache -s

      - uses: apache/infrastructure-actions/stash/save@3354c1565d4b0e335b78a76aedd82153a9e144d4
        with:
          path: "${{ env.CCACHE_DIR }}"
          key: ccache-linux-adapters

      - name: Run non-GPU tests
        env:
          LIBHDFS3_CONF: "${{ github.workspace }}/scripts/hdfs-client.xml"
        working-directory: _build/release
        run: |
          if [ -f "/opt/miniforge/etc/profile.d/conda.sh" ]; then
            source "/opt/miniforge/etc/profile.d/conda.sh"
            conda activate adapters
          fi

          export CLASSPATH=`/usr/local/hadoop/bin/hdfs classpath --glob`
          ctest -j 8 --output-on-failure --no-tests=error \
            -E "velox_exec_test|velox_hdfs_file_test|velox_s3|velox_cudf_"

      - name: Copy Shared Libraries for cuDF Test Binaries
        env:
          CUDF_DIR: _build/release/velox/experimental/cudf
        run: |
          mkdir -p "$CUDF_DIR/cudf-libs"
          deps=$(
            find "$CUDF_DIR/tests" -name "velox_cudf_*" -type f -executable |
            xargs ldd 2>/dev/null |
            sed -n 's/[^\/]*\(\/[^ ]*\) .*/\1/p' |
            grep -vE '^/(lib|usr/lib|lib64)/(libcuda|librt\.so|libm\.so|libstdc\+\+\.so|ld-linux-x86-64\.so|libc\.so)' |
            sort -u
          )
          if [ -z "$deps" ]; then
            echo "Error: No dependencies found"
            exit 1
          fi
          (
            echo "$deps" |
            xargs readlink -f |
            xargs -I {} cp {} "$CUDF_DIR/cudf-libs/"
          )
          lndeps=$(echo "$deps" | xargs -I {} bash -c '[ -L "$1" ] && echo "$1" || true' bash {})
          (
            cd "$CUDF_DIR/cudf-libs" || exit 1
            while IFS= read -r link; do
              [[ -L "$link" ]] || continue
              target=$(readlink -f "$link") || continue
              target_basename=$(basename "$target") || continue
              link_basename=$(basename "$link") || continue
              ln -sf "$target_basename" "$link_basename"
            done <<< "$lndeps"
          )
          tar -cvf "$CUDF_DIR/cudf-libs.tar" -C "$CUDF_DIR" cudf-libs

      - name: Upload cuDF Test Binaries
        uses: actions/upload-artifact@v4
        with:
          name: cudftestbinaries
          path: |
            velox/dwio/parquet/tests/examples/int.parquet
            velox/experimental/cudf/tests/CMakeLists.txt
            _build/release/velox/experimental/cudf/tests/velox_cudf_*
            _build/release/velox/experimental/cudf/tests/CTestTestfile.cmake
            _build/release/velox/experimental/cudf/cudf-libs.tar

  cudf-tests:
    name: cuDF GPU tests
    runs-on: linux-amd64-gpu-l4-latest-1
    needs: adapters
    timeout-minutes: 30
    env:
      CUDF_DIR: _build/release/velox/experimental/cudf
    steps:
      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake patchelf cuda-toolkit-12-9
          export MINIO_VERSION="2022-05-26T05-48-41Z"
          export MINIO_BINARY_NAME="minio-2022-05-26"
          wget https://dl.min.io/server/minio/release/linux-amd64/archive/minio.RELEASE."${MINIO_VERSION}" -O "${MINIO_BINARY_NAME}"
          sudo mv ./"${MINIO_BINARY_NAME}" /usr/local/bin/
          sudo chmod +x /usr/local/bin/"${MINIO_BINARY_NAME}"

      - name: Check NVIDIA Driver Version
        run: nvidia-smi

      - name: Download cuDF Test Binaries
        uses: actions/download-artifact@v4
        with:
          name: cudftestbinaries

      - name: Adapt Downloaded Files
        run: |
          sed -i 's|/__w/velox/velox|${{ github.workspace }}|g' $CUDF_DIR/tests/CTestTestfile.cmake
          grep "Source directory" $CUDF_DIR/tests/CTestTestfile.cmake
          grep "Build directory" $CUDF_DIR/tests/CTestTestfile.cmake
          (cd $CUDF_DIR && tar -xf cudf-libs.tar)
          for exe in $CUDF_DIR/tests/velox_cudf_*; do
            patchelf --force-rpath --set-rpath '$ORIGIN/../cudf-libs' "$exe"
            chmod +x "$exe"
          done

      - name: Run cuDF Tests
        run: |
          cd $CUDF_DIR/tests/
          ctest --output-on-failure

